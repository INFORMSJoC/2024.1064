[build-system]
requires = [
    "setuptools>=75",
    "pybind11>=2.13",
]
build-backend = "setuptools.build_meta"

[project]
name = "pwlopt"
version = "0.1.0"
description = "Software implementation for PWL function fitting, MILP modeling and application to pumped-storage hydropower plant scheduling"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "matplotlib",
    "xpress",
    "networkx",
    "python-sat",
    "pydantic",
    "scipy",
    "pyintval",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["xpress", "xpress.*", "networkx", "networkx.*", "scipy", "scipy.*", "pyintval", "pyintval.*"]
ignore_missing_imports = true

[project.optional-dependencies]
fitting = [
]

modeling = [
]

hydropower = [
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]